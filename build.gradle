plugins {
    id 'eclipse'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = '1.0.0'
group = 'com.gunholsters'
base { archivesName = 'gunholsters-1.20.1' }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods { gunholsters { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            args '--nogui'
            mods { gunholsters { source sourceSets.main } }
        }
    }
}

repositories {
    maven { url = 'https://maven.theillusivec4.top/' }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.2.0'
    compileOnly(fg.deobf('top.theillusivec4.curios:curios-forge:5.10.0+1.20.1:api'))
    runtimeOnly(fg.deobf('top.theillusivec4.curios:curios-forge:5.10.0+1.20.1'))
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
